<text x="28" y="416" font-size="12" fill="#898781">总预算只是 GRPO 的 1/3 到 1/13；「35 倍」指指令遵循任务在第 678 次采样处达到最优（24,000 ÷ 678 ≈ 35）。预算大头花在验证集上而非学习上。</text>
