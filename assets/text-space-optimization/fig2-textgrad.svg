<text x="440" y="108" font-size="12" fill="#898781" text-anchor="middle">前向</text>
<text x="736" y="258" font-size="12" fill="#898781" text-anchor="end">反向（批评由 gpt-4o 生成，此处文字为示意）</text>
<rect x="456" y="270" width="394" height="62" rx="10" fill="#fdebe3" stroke="#eb6834"/>
<text x="653.0" y="292" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">对「回答」的批评</text>
<text x="653.0" y="312" font-size="12" fill="#52514e" text-anchor="middle">「漏数了一件物品，也没有逐项列出数量」</text>
<rect x="28" y="270" width="364" height="62" rx="10" fill="#fdebe3" stroke="#eb6834"/>
<text x="210.0" y="292" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">对「提示词」的批评</text>
<text x="210.0" y="312" font-size="12" fill="#52514e" text-anchor="middle">「应要求先逐项列出名称与数量，再求和并复核」</text>
<line x1="750" y1="194" x2="750" y2="266" stroke="#eb6834" stroke-width="1.6" marker-end="url(#ao)"/>
<line x1="452" y1="301" x2="396" y2="301" stroke="#eb6834" stroke-width="1.6" marker-end="url(#ao)"/>
<line x1="113" y1="266" x2="113" y2="236" stroke="#eb6834" stroke-width="1.6" marker-end="url(#ao)"/>
<text x="124" y="258" font-size="12" fill="#52514e" text-anchor="start">文本梯度下降：优化器模型按批评重写提示词</text>
<line x1="28" y1="362" x2="852" y2="362" stroke="#e5e4e0"/>
<text x="28" y="388" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">论文里的真实前后对比（大基准难题集的物品计数任务，12 次迭代、每批 3 题，共见 36 道训练题）</text>
<rect x="28" y="402" width="400" height="96" rx="10" fill="#f0efec" stroke="#e5e4e0"/>
<text x="228.0" y="424" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">优化前　准确率 77.8%</text>
<text x="228.0" y="444" font-size="12" fill="#52514e" text-anchor="middle">「回答推理题。逐步思考。最后一行用</text>
<text x="228.0" y="461" font-size="12" fill="#52514e" text-anchor="middle">『Answer: 数值』的格式给出答案。」</text>
<rect x="452" y="402" width="400" height="96" rx="10" fill="#e6f0fc" stroke="#2a78d6"/>
<text x="652.0" y="424" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">优化后　准确率 91.9%</text>
<text x="652.0" y="444" font-size="12" fill="#52514e" text-anchor="middle">「逐项列出物品与数量；直接从清单求和；</text>
<text x="652.0" y="461" font-size="12" fill="#52514e" text-anchor="middle">核对每项是否与问题相关；给出答案前再数一遍。」</text>
</svg>