<text x="113.0" y="214.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">题目</text>
<rect x="262" y="120" width="130" height="70" rx="10" fill="#f0efec" stroke="#e5e4e0"/>
