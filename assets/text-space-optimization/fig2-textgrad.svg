<text x="521.0" y="142" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">回答</text>
<text x="521.0" y="162" font-size="12" fill="#52514e" text-anchor="middle">中间变量</text>
<rect x="650" y="120" width="200" height="70" rx="10" fill="#f0efec" stroke="#e5e4e0"/>
<text x="750.0" y="142" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">损失</text>
<text x="750.0" y="162" font-size="12" fill="#52514e" text-anchor="middle">对照标准答案的评价</text>
