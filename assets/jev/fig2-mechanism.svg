<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="609" rx="14" fill="#fcfcfb" stroke="#e5e4e0"/>
  <text x="28" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Jev 内部大概怎么工作</text>
  <text x="772" y="40" font-size="12" fill="#8a897f" text-anchor="end">状态读一遍，问题并行答</text>

  <!-- 状态 -->
  <text x="28" y="78" font-size="13" font-weight="700" fill="#0b0b0b">状态（一条客户消息）</text>
  <rect x="28" y="88" width="200" height="92" rx="8" fill="#ffffff" stroke="#d8d7d2"/>
  <g font-size="12.5" fill="#0b0b0b">
    <text x="42" y="114">订单 8842 的退款三天了</text>
    <text x="42" y="136">还没到账，今天再不处理</text>
    <text x="42" y="158">我就去 12315 投诉。</text>
  </g>
  <line x1="128" y1="180" x2="128" y2="246" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="210" font-size="12" fill="#8a897f">只读这一遍</text>
  <text x="140" y="228" font-size="12" fill="#8a897f">按输入词元计费</text>

  <rect x="28" y="248" width="200" height="72" rx="8" fill="#edf5f0" stroke="#8fbf9f"/>
  <text x="128" y="278" font-size="13" fill="#0b0b0b" text-anchor="middle">对这段话的内部表示</text>
  <text x="128" y="300" font-size="12" fill="#2f7a4b" text-anchor="middle">算好后缓存，所有问题共用</text>

  <!-- 主干 -->
  <g stroke="#52514e" stroke-width="1.5" fill="none">
    <line x1="228" y1="284" x2="258" y2="284"/>
    <line x1="258" y1="124" x2="258" y2="420"/>
    <line x1="258" y1="124" x2="288" y2="124" marker-end="url(#arrow)"/>
    <line x1="258" y1="272" x2="288" y2="272" marker-end="url(#arrow)"/>
    <line x1="258" y1="420" x2="288" y2="420" marker-end="url(#arrow)"/>
  </g>

  <!-- 分支 1 是否题 -->
  <rect x="290" y="78" width="200" height="92" rx="8" fill="#ffffff" stroke="#d8d7d2"/>
  <text x="304" y="102" font-size="11.5" fill="#8a897f">是否题</text>
  <text x="304" y="126" font-size="13" fill="#0b0b0b">要不要调用</text>
  <text x="304" y="148" font-size="13" fill="#0b0b0b">「查询退款状态」工具？</text>
  <line x1="490" y1="124" x2="518" y2="124" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="520" y="78" width="252" height="92" rx="8" fill="#ffffff" stroke="#d8d7d2"/>
  <g font-size="12">
    <text x="534" y="116" fill="#0b0b0b">是</text><rect x="600" y="105" width="125" height="13" rx="2" fill="#4c9a6a"/><text x="731" y="116" fill="#0b0b0b">0.96</text>
    <text x="534" y="144" fill="#0b0b0b">否</text><rect x="600" y="133" width="5" height="13" rx="2" fill="#c9c8c1"/><text x="611" y="144" fill="#8a897f">0.04</text>
  </g>

  <line x1="290" y1="198" x2="772" y2="198" stroke="#b9b8b0" stroke-dasharray="4 4"/>

  <!-- 分支 2 选择题 -->
  <rect x="290" y="226" width="200" height="92" rx="8" fill="#ffffff" stroke="#d8d7d2"/>
  <text x="304" y="250" font-size="11.5" fill="#8a897f">选择题（你给 4 个选项）</text>
  <text x="304" y="280" font-size="13" fill="#0b0b0b">这条消息的意图是？</text>
  <line x1="490" y1="272" x2="518" y2="272" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="520" y="226" width="252" height="92" rx="8" fill="#ffffff" stroke="#d8d7d2"/>
  <g font-size="12">
    <text x="534" y="249" fill="#0b0b0b">退款进度</text><rect x="600" y="238" width="105" height="13" rx="2" fill="#4c9a6a"/><text x="711" y="249" fill="#0b0b0b">0.81</text>
    <text x="534" y="269" fill="#0b0b0b">投诉</text><rect x="600" y="258" width="18" height="13" rx="2" fill="#c9c8c1"/><text x="624" y="269" fill="#8a897f">0.14</text>
    <text x="534" y="289" fill="#0b0b0b">退货申请</text><rect x="600" y="278" width="4" height="13" rx="2" fill="#c9c8c1"/><text x="610" y="289" fill="#8a897f">0.03</text>
    <text x="534" y="309" fill="#0b0b0b">其他</text><rect x="600" y="298" width="3" height="13" rx="1.5" fill="#c9c8c1"/><text x="609" y="309" fill="#8a897f">0.02</text>
  </g>

  <line x1="290" y1="346" x2="772" y2="346" stroke="#b9b8b0" stroke-dasharray="4 4"/>
  <text x="531" y="362" font-size="11.5" fill="#8a897f" text-anchor="middle">虚线：分支之间互相看不见，上一题的答案不会影响下一题</text>

  <!-- 分支 3 打分题 -->
  <rect x="290" y="374" width="200" height="92" rx="8" fill="#ffffff" stroke="#d8d7d2"/>
  <text x="304" y="398" font-size="11.5" fill="#8a897f">打分题（1 到 5 档）</text>
  <text x="304" y="428" font-size="13" fill="#0b0b0b">情绪有多激烈？</text>
  <line x1="490" y1="420" x2="518" y2="420" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="520" y="374" width="252" height="92" rx="8" fill="#ffffff" stroke="#d8d7d2"/>
  <g font-size="11.5" text-anchor="middle">
    <rect x="540" y="441" width="22" height="1" fill="#c9c8c1"/><text x="551" y="458" fill="#8a897f">1</text>
    <rect x="574" y="440" width="22" height="2" fill="#c9c8c1"/><text x="585" y="458" fill="#8a897f">2</text>
    <rect x="608" y="429" width="22" height="13" fill="#c9c8c1"/><text x="619" y="458" fill="#8a897f">3</text><text x="619" y="424" fill="#8a897f">0.14</text>
    <rect x="642" y="398" width="22" height="44" fill="#4c9a6a"/><text x="653" y="458" fill="#8a897f">4</text><text x="653" y="394" fill="#0b0b0b">0.46</text>
    <rect x="676" y="406" width="22" height="36" fill="#4c9a6a"/><text x="687" y="458" fill="#8a897f">5</text><text x="687" y="402" fill="#0b0b0b">0.38</text>
  </g>
  <text x="762" y="424" font-size="12" fill="#0b0b0b" text-anchor="end">分值</text>
  <text x="762" y="444" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="end">4.2</text>

  <!-- 注 -->
  <rect x="28" y="494" width="744" height="94" rx="8" fill="#ffffff" stroke="#e5e4e0"/>
  <g font-size="12.5" fill="#0b0b0b">
    <text x="42" y="519">① 概率只在你给的选项上分配，合计为 1，所以不可能输出选项之外的东西。选项之内仍然可能选错。</text>
    <text x="42" y="544">② 不写任何文字，各题可以同时算：题目再多也几乎不加时间，输出不计费。</text>
    <text x="42" y="569" fill="#8a897f">③ 官方未披露架构。本图是与公开现象相容的推断，图中数值为示意，不是实际调用结果。</text>
  </g>
</svg>
