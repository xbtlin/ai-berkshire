name: 🐞 Skill error / unable to run
description: A certain skill reports an error, gets stuck, or is unable to run due to missing tools/parameters.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the feedback 🙏 **Please be sure to provide specific reproducible information** - Error reports without reproducible information cannot be located and will be asked to be supplemented or closed directly.
        Before submitting, please search to see if there is already an identical issue.
  - type: dropdown
    id: skill
    attributes:
      label: Skill involved
      description: In which skill did the error occur? Choose only one, and make sure that the title and the main text describe the same thing (there have been cases where the title was written investment-research and the main text was written investment-team).
      options:
        - bottleneck-hunter
        - deep-company-series
        - dyp-ask
        - earnings-review
        - earnings-team
        - financial-data
        - industry-funnel
        - industry-research
        - investment-checklist
        - investment-research
        - investment-team
        - management-deep-dive
        - news-pulse
        - portfolio-review
        - private-company-research
        - quality-screen
        - thesis-drift
        - thesis-tracker
        - wechat-article
        - Not sure
        - Others/involving multiple
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: the complete command you ran
      description: Post the exact command you typed, verbatim.
      placeholder: "/investment-team Meituan"
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: expected result vs actual result
      description: What do you expect to happen? What actually happened? Please **post the complete error message/log**, don’t just describe it.
      placeholder: |
        Expectation: Normally generate the four-master parallel analysis report
        Actual: The error "TeamCreate is not a valid tool" is reported and the process is interrupted.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: steps to reproduce
      description: How can I reproduce the operation from beginning to end? (Installation method, operating environment, specific operation sequence)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: model used
      description: Different models may perform differently, and this item is crucial for positioning.
      placeholder: "Opus 4.8 / Sonnet / Others"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: client and version
      placeholder: "Claude Code CLI (version number) / Codex / IDE plug-in"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: confirm
      options:
        - label: I have searched for existing issues and confirmed that there are no duplicates.
          required: true
        - label: I have provided complete and reproducible information (commands, error reports, models, clients)
          required: true
