name: 💬 Discussion / New Skill Proposal / Others
description: New skill proposal, usage discussion, acknowledgment or general feedback (not error reporting/data/suggestion type)
title: "[Discussion] "
labels: ["discussion"]
body:
  - type: markdown
    attributes:
      value: |
        This is used for **non-problem** communication: new skill proposals, usage discussions, acknowledgments, etc.
        If you want to report a skill error, data error, or make suggestions for improvement, please go back and select the corresponding dedicated template (those that require reproducible information).
  - type: textarea
    id: content
    attributes:
      label: content
      description: Make it clear what you want to discuss/propose. If you are proposing a new skill, please describe what research scenario it solves and the boundaries of existing skills.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: confirm
      options:
        - label: I have searched for existing issues and confirmed that there are no duplicates.
          required: true
        - label: This is not a skill error report/data error/improvement suggestion (those should use a dedicated template)
          required: true
