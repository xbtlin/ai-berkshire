name: 📉 Data error (stock price/market capitalization/financial data)
description: Incorrect share price, market cap, valuation or financial data in report
title: "[Data] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the feedback 🙏 Data questions **must provide verifiable evidence**: specific target + wrong value + what you think is the correct value + **source link**.
        Just saying "data is often wrong" without giving specific examples cannot be verified and you will be asked to supplement.
  - type: input
    id: ticker
    attributes:
      label: involved subject/stock code
      placeholder: "NVDA / Tencent 0700.HK / 37 Interactive Entertainment 002555"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Skill or report in which the problem occurred
      description: Which skill generated it, or which report is under reports/ (paste the path or link).
      placeholder: "reports/Tencent/Tencent-research-20260408.md, or /investment-research"
    validations:
      required: true
  - type: textarea
    id: wrong-value
    attributes:
      label: What is the wrong data?
      description: Which field (stock price/market capitalization/PE/income...) and what value is displayed in the report.
      placeholder: 'The report says "market capitalization is HK$4.33 trillion"'
    validations:
      required: true
  - type: textarea
    id: correct-value
    attributes:
      label: what you think is the correct value + source (required)
      description: What should be the correct value? **The source link must be attached** (Futu/Dongcai/Official Financial Report, etc.), and explain whether it involves restoration of rights, transfer, additional issuance, exchange rate and other caliber issues.
      placeholder: |
        The correct value should be ~4.65 trillion Hong Kong dollars.
        Source: https://www.futunn.com/stock/00700-HK
        Reason: The total share capital used in the report is the old value before the additional issuance/historical price before restoration.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduce command/step
      placeholder: "/investment-research Tencent"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: confirm
      options:
        - label: I have searched for existing issues and confirmed that there are no duplicates.
          required: true
        - label: I have provided the correct value and a verifiable source link
          required: true
