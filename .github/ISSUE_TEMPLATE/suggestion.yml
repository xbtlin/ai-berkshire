name: 💡 Improvement suggestions
description: Suggestions for improving report formats, skill processes or frameworks
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestions 🙏 **Please attach specific and reproducible examples**: In which report/table did you see the problem, and what do you expect to change it to.
        Suggestions that only have abstract descriptions (such as "inconvenient to read") without specific sources are difficult to implement, and you will be asked to add them.
  - type: textarea
    id: problem
    attributes:
      label: the problem you observed + specific source (required)
      description: In which report, paragraph or table did you see it? Please post a link or screenshot, preferably the original snippet in question.
      placeholder: |
        reports/Screening of the 10 core targets in the global AI track-market value comparison table of 20260628.md,
        In the same column, NVIDIA uses US dollars and SK Hynix uses Korean won. There is no way to compare the sizes horizontally.
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: desired improvement effect (required)
      description: It is best to give a comparison of "currently looks like this → expected to look like this". The more specific it is, the easier it will be adopted.
      placeholder: |
        Current: Market cap column mixes USD/KRW
        Expectation: In the cross-market comparison table, the absolute magnitude columns are uniformly converted into US dollars and the exchange rate is indicated.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Supplementary explanation (optional)
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: confirm
      options:
        - label: I have searched for existing issues and confirmed that there are no duplicates.
          required: true
        - label: I have provided specific sources and desired effects, not just abstract descriptions
          required: true
