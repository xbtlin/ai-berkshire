function filter(){const q=el('query').value.trim().toLowerCase(),scope=el('scope').value;filtered=records.filter(r=>(scope==='all'||(scope==='related'?r.category!=='关联候选':['观点','体验'].includes(r.category)))&&(!q||[r.display_time,r.summary,r.status_id,r.category].join(' ').toLowerCase().includes(q))).sort((a,b)=>(a.display_time.localeCompare(b.display_time)||Number(a.status_id)-Number(b.status_id))*(el('order').value==='desc'?-1:1));renderList();if(!filtered.length){el('count').textContent='没有匹配的条目';updateButtons();return}if(!filtered.some(r=>r.status_id===selected))select(filtered[0].status_id);else updateButtons()}
function renderList(){el('count').textContent=`${filtered.length} 条 · 摘要仅用于导航`;el('list').replaceChildren();for(const r of filtered){const b=document.createElement('button');b.type='button';b.className='entry'+(r.status_id===selected?' active':'');b.dataset.id=r.status_id;const time=document.createElement('time');time.textContent=r.display_time+(r.time_kind==='edited'?' · 修改':'');const tag=document.createElement('span');tag.className='tag';tag.textContent=r.category;const preview=document.createElement('div');preview.className='preview';preview.textContent=r.summary;b.append(tag,time,preview);b.addEventListener('click',()=>{select(r.status_id);if(innerWidth<801)document.body.classList.remove('showlist')});el('list').appendChild(b)}}
function select(id){const r=byId.get(id);if(!r)return;selected=id;history.replaceState(null,'','#'+id);try{localStorage.setItem('duan-popmart-last',id)}catch{}el('current').textContent=r.display_time+(r.time_kind==='edited'?'（修改）':'');el('source').href=r.url;el('summarytext').textContent=r.summary;el('summary').open=false;showOriginal(r);for(const b of el('list').children)b.classList.toggle('active',b.dataset.id===id);updateButtons()}
function showOriginal(r){const imported=localTexts.get(r.status_id);el('local').hidden=!imported;el('original').hidden=!!imported;if(imported){el('original').removeAttribute('src');el('local').replaceChildren();const label=document.createElement('h2');label.textContent='你导入的原文 · 仅在当前页面展示';const text=document.createElement('div');text.textContent=imported;el('local').append(label,text);el('help').textContent='正在展示你导入的原文。可通过右上角链接核对雪球原帖。'}else{el('original').src=r.url;el('help').textContent='正文由雪球原站直接加载。若弹出登录邀请，可点“跳过”或右上角 ×；部分内容需要登录。无法加载时请点“在雪球打开”。'}}
function updateButtons(){const i=filtered.findIndex(r=>r.status_id===selected);el('prev').disabled=i<=0;el('next').disabled=i<0||i>=filtered.length-1}
function step(d){const i=filtered.findIndex(r=>r.status_id===selected);if(filtered[i+d])select(filtered[i+d].status_id)}
el('query').addEventListener('input',filter);el('scope').addEventListener('change',filter);el('order').addEventListener('change',filter);el('prev').addEventListener('click',()=>step(-1));el('next').addEventListener('click',()=>step(1));el('toggle').addEventListener('click',()=>document.body.classList.toggle('showlist'));
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowDown'){e.preventDefault();step(1)}if(e.key==='ArrowUp'){e.preventDefault();step(-1)}});
el('import').addEventListener('change',async e=>{try{const file=e.target.files[0];if(!file)return;const parsed=JSON.parse(await file.text());const rows=Array.isArray(parsed)?parsed:parsed.records||parsed.posts;if(!Array.isArray(rows))throw Error('请使用记录数组，或包含 records／posts 数组的 JSON');let n=0;for(const row of rows){const id=String(row.status_id||row.id||(row.url||'').split('/').pop()||'');const text=row.body??row.text??row.content;if(byId.has(id)&&typeof text==='string'&&text.trim()){localTexts.set(id,text);n++}}el('importstatus').textContent=`已匹配 ${n} 条原文，仅保留在本页内存中。`;if(selected)showOriginal(byId.get(selected))}catch(err){el('importstatus').textContent='无法导入：'+err.message}});
let start=location.hash.slice(1);try{if(!byId.has(start))start=localStorage.getItem('duan-popmart-last')}catch{}filter();if(byId.has(start)){if(!filtered.some(r=>r.status_id===start)){el('scope').value='all';filter()}select(start)}
</script></body></html>
